name: Refresh WDI data

# These are annual series. The World Bank revises them continuously but
# publishes most of them once or twice a year, so a monthly pull is already
# well ahead of the publication rate. The job commits only when the bundle
# actually changed, which keeps the history a log of real data revisions
# rather than a log of cron firings.
#
# workflow_dispatch lets you force a refresh by hand from the Actions tab
# whenever the World Bank announces a release.
on:
  schedule:
    - cron: "0 6 1 * *"      # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild bundle from the World Bank API
        run: node scripts/refresh_data.mjs

      # A failed or partial API pull must never overwrite good data. If any of
      # these checks trips, the job fails with the bundle uncommitted and the
      # live site keeps serving the last known-good version.
      - name: Sanity-check the result
        run: |
          node -e '
            const b = require("./public/data/wdi.json");
            const expected = require("./data/indicators.json").length;
            const errs = [];
            if (b.countries.length < 150) errs.push(`only ${b.countries.length} countries`);
            // Derived from the glossary, not hardcoded: adding an indicator is
            // meant to be a data-only change, and a literal here would break
            // the monthly refresh the moment someone adds one.
            if (b.indicators.length !== expected) errs.push(`${b.indicators.length} indicators, expected ${expected}`);
            const withGdp = Object.values(b.series).filter(s => s.gdp?.v > 0).length;
            if (withGdp < 150) errs.push(`only ${withGdp} countries have GDP`);
            if (b.yearSpan[1] < new Date().getFullYear() - 3) errs.push(`stale: latest year ${b.yearSpan[1]}`);

            // The official regional aggregates are the benchmark every region
            // row is scored against. Losing them does not blank one cell, it
            // empties the whole region view — so it fails the job.
            const regionCount = b.regions.length;
            const mapped = (b.regionCodes ?? []).filter(Boolean);
            if (mapped.length !== regionCount) {
              errs.push(`${mapped.length}/${regionCount} regions have an official aggregate mapped`);
            }
            for (const code of mapped) {
              const got = Object.keys(b.regionSeries?.[code] ?? {}).length;
              if (got < expected) errs.push(`aggregate ${code} carries ${got}/${expected} indicators`);
            }
            // The World aggregate is what a REGION row's sparkline is drawn
            // against. Losing it strips the reference line off the region view.
            const world = Object.keys(b.worldSeries ?? {}).length;
            if (world < expected) errs.push(`world aggregate carries ${world}/${expected} indicators`);
            if (errs.length) { console.error("REFUSING TO COMMIT:", errs.join("; ")); process.exit(1); }
            console.log(`ok — ${b.countries.length} countries, ${mapped.length} regional aggregates + world, data through ${b.yearSpan[1]}`);
          '

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- public/data/wdi.json; then
            echo "No change in the World Bank data this month."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/wdi.json
          git commit -m "data: refresh WDI bundle from World Bank API"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Only runs when the data actually moved. See the note in deploy.yml for why
  # this call is necessary rather than relying on the push above.
  redeploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
