name: Build and deploy

# Three entry points:
#   push to main    — you changed code
#   workflow_call   — the monthly data refresh changed the bundle and is
#                     invoking this directly. This matters: a commit pushed by
#                     GITHUB_TOKEN does NOT trigger other workflows, so without
#                     this the refreshed data would land in the repo and never
#                     reach the site.
#   workflow_dispatch — you want to redeploy by hand
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # BASE_PATH must match the repository name so asset URLs resolve under
      # https://<user>.github.io/<repo>/. Derived from the repo itself so
      # renaming it does not silently break the deploy.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
