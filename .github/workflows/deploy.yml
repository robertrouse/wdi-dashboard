name: Build and deploy

# Three entry points:
#   push to main    — you changed code
#   workflow_call   — the monthly data refresh changed the bundle and is
#                     invoking this directly. This matters: a commit pushed by
#                     GITHUB_TOKEN does NOT trigger other workflows, so without
#                     this the refreshed data would land in the repo and never
#                     reach the site.
#   workflow_dispatch — you want to redeploy by hand
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pin to the branch tip, not the default github.sha. On a workflow_call
      # github.sha is the commit that triggered the CALLER — for the monthly
      # refresh that is the commit *before* its own data commit, so the default
      # would rebuild the previous bundle and silently deploy stale data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # data/indicators.json is the source of truth for indicator metadata, but
      # the app never reads it — the build embeds a copy into the data bundle.
      # Editing the glossary without rebuilding the bundle therefore changes
      # nothing on the page and gives no error, which is a silent way to ship
      # stale definitions and caveats. Both data paths copy the file verbatim,
      # so any drift means the bundle was not rebuilt.
      - name: Indicator metadata matches the bundle
        run: |
          node -e '
            const a = require("./data/indicators.json");
            const b = require("./public/data/wdi.json").indicators;
            if (JSON.stringify(a) !== JSON.stringify(b)) {
              console.error("data/indicators.json and public/data/wdi.json disagree.");
              console.error("Rebuild the bundle: npm run refresh (or scripts/build_data.py).");
              const ids = new Set([...a, ...b].map(i => i.id));
              for (const id of ids) {
                const x = a.find(i => i.id === id), y = b.find(i => i.id === id);
                if (JSON.stringify(x) !== JSON.stringify(y)) console.error("  differs:", id);
              }
              process.exit(1);
            }
            console.log(`ok — ${a.length} indicators in sync`);
          '
      # BASE_PATH must match the repository name so asset URLs resolve under
      # https://<user>.github.io/<repo>/. Derived from the repo itself so
      # renaming it does not silently break the deploy.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
